name: SafeSound demo (GitHub Pages)

on:
  push:
    branches: [master]
    paths: ["safesound/**", ".github/workflows/safesound-pages.yml"]
  pull_request:
    paths: ["safesound/**", ".github/workflows/safesound-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safesound
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: safesound/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python -m safesound.static_export ../_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
